name: Package CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn pack:check
      - run: yarn test:packed
      - name: Build reference site under repository subpath
        env:
          ORG_NAME: test-organization
          PROJECT_NAME: test-project
          DISABLE_REVISION_HISTORY: "1"
        run: yarn build
