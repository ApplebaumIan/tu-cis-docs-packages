name: Sync Generated Template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated template repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GENERATED_TEMPLATE_REPOSITORY }}
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: generated
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate clean template
        run: |
          for attempt in {1..40}; do
            rm -rf next-template
            if npx --yes @tu-cis-courses/create-project-docs@next new next-template --skip-install; then
              exit 0
            fi
            sleep 15
          done

          exit 1
      - name: Replace generated files
        run: rsync -a --delete --exclude .git next-template/ generated/
      - name: Install generated dependencies
        working-directory: generated/documentation
        run: yarn install
      - name: Verify generated build
        working-directory: generated/documentation
        env:
          ORG_NAME: test-organization
          PROJECT_NAME: test-project
          DISABLE_REVISION_HISTORY: "1"
        run: yarn build
      - name: Publish generated commit
        working-directory: generated
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "chore: sync documentation template"
          git push
